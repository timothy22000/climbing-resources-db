name: Export Data

on:
  push:
    branches:
      - main
    paths:
      - 'source/climbing_resources_database.xlsx'
  workflow_dispatch:

jobs:
  export:
    name: Regenerate CSVs and Parquet from XLSX
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyarrow openpyxl

      - name: Export CSV and Parquet
        run: python scripts/export_csv.py

      - name: Validate exported data
        run: python scripts/validate.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-export data from XLSX [skip ci]"
            git push
          fi
