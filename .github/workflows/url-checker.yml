name: URL Health Check

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  check-urls:
    name: Check all resource URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run URL checker
        id: url_check
        run: |
          python scripts/check_urls.py --output url_report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload URL report
        uses: actions/upload-artifact@v4
        with:
          name: url-health-report
          path: url_report.md
          retention-days: 30

      - name: Open issue on failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('url_report.md')
              ? fs.readFileSync('url_report.md', 'utf8').slice(0, 60000)
              : 'URL report not generated.';
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[URL Check] Dead links detected (${date})`,
              body:  `The weekly URL health check found broken links.\n\n<details><summary>Report</summary>\n\n\`\`\`\n${report}\n\`\`\`\n</details>\n\nPlease fix the affected entries and update \`last_verified\`.`,
              labels: ['data-quality', 'broken-link'],
            });
